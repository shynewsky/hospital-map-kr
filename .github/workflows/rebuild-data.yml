name: Rebuild HIRA data

on:
  workflow_dispatch:
    inputs:
      hospital_zip_url:
        description: Direct URL for the HIRA nationwide hospital ZIP
        required: true
        type: string
      equipment_csv_url:
        description: Direct URL for the HIRA equipment CSV
        required: true
        type: string
      dataset_version:
        description: Dataset version shown in the manifest (YYYY-MM)
        required: true
        default: "2026-06"
        type: string
      hospital_reference_date:
        description: Hospital data reference date (YYYY-MM-DD)
        required: true
        default: "2026-06-30"
        type: string
      equipment_reference_date:
        description: Equipment data reference date (YYYY-MM-DD)
        required: true
        default: "2024-12-31"
        type: string
      hospital_source_name:
        description: Hospital source label for attribution
        required: true
        default: "HIRA 전국 병의원 및 약국 현황 2026.6"
        type: string
      equipment_source_name:
        description: Equipment source label for attribution
        required: true
        default: "HIRA 의료장비 상세 현황 2024.12"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data builder dependency
        run: python -m pip install openpyxl

      - name: Download official source files
        env:
          HOSPITAL_ZIP_URL: ${{ inputs.hospital_zip_url }}
          EQUIPMENT_CSV_URL: ${{ inputs.equipment_csv_url }}
        run: |
          mkdir -p .tmp
          curl --fail --location --retry 3 --retry-delay 5 "$HOSPITAL_ZIP_URL" --output .tmp/hospitals.zip
          curl --fail --location --retry 3 --retry-delay 5 "$EQUIPMENT_CSV_URL" --output .tmp/equipment.csv

      - name: Rebuild regional JSON
        env:
          DATASET_VERSION: ${{ inputs.dataset_version }}
          HOSPITAL_REFERENCE_DATE: ${{ inputs.hospital_reference_date }}
          EQUIPMENT_REFERENCE_DATE: ${{ inputs.equipment_reference_date }}
          HOSPITAL_SOURCE_NAME: ${{ inputs.hospital_source_name }}
          EQUIPMENT_SOURCE_NAME: ${{ inputs.equipment_source_name }}
        run: |
          python scripts/build_data.py \
            --hira-zip .tmp/hospitals.zip \
            --equipment-csv .tmp/equipment.csv \
            --out data \
            --dataset-version "$DATASET_VERSION" \
            --hospital-reference-date "$HOSPITAL_REFERENCE_DATE" \
            --equipment-reference-date "$EQUIPMENT_REFERENCE_DATE" \
            --hospital-source-name "$HOSPITAL_SOURCE_NAME" \
            --equipment-source-name "$EQUIPMENT_SOURCE_NAME"

      - name: Validate rebuilt data
        run: python scripts/validate_data.py

      - name: Commit rebuilt data branch
        id: changes
        env:
          DATASET_VERSION: ${{ inputs.dataset_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SAFE_VERSION=$(printf '%s' "$DATASET_VERSION" | tr -c 'A-Za-z0-9._-' '-')
          BRANCH="data/hira-${SAFE_VERSION}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update HIRA data to ${DATASET_VERSION}"
          git push --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open data update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET_VERSION: ${{ inputs.dataset_version }}
          BRANCH: ${{ steps.changes.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update HIRA data to ${DATASET_VERSION}" \
            --body "Automated rebuild from the official HIRA files supplied to the workflow. The generated regional JSON passed scripts/validate_data.py. Review source dates, region labels, and count changes before merging." || {
              echo "The data branch was pushed, but repository settings blocked automatic PR creation." >> "$GITHUB_STEP_SUMMARY"
              echo "Open: ${{ github.server_url }}/${{ github.repository }}/compare/main...${BRANCH}?expand=1" >> "$GITHUB_STEP_SUMMARY"
            }

      - name: Report unchanged data
        if: steps.changes.outputs.changed == 'false'
        run: echo "The rebuild matched the committed data, so no pull request was created." >> "$GITHUB_STEP_SUMMARY"
